<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynxo Language Learning</title>
<style>
:root{ --eel:#3c3c3c; --dim:#777; --line:#e5e5e5; --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6; --red:#ff4b4b; --red-d:#d33131; --gold:#f5c518; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:#fff; color:var(--eel); font-family:Roboto,Arial,sans-serif; }
button{ font-family:inherit; }
:focus{ outline:3px solid var(--blue); outline-offset:2px; }
#lynxo-language-app{ max-width:860px; margin:0 auto; padding:0 12px 110px 12px; }
header.top{ display:flex; align-items:center; gap:8px; padding:12px 2px 8px 2px; position:sticky; top:0; background:#fff; z-index:20; border-bottom:2px solid var(--line); }
header.top h1{ font-size:19px; color:var(--eel); margin:0; flex:1; line-height:1.15; font-weight:800; }
.iconbtn{ background:#fff; color:var(--blue); border:2px solid var(--line); border-bottom:4px solid var(--line); border-radius:12px; font-size:15px; font-weight:bold; padding:10px 12px; cursor:pointer; min-height:48px; }
.langbtn{ background:#fff; color:var(--eel); border:2px solid var(--line); border-bottom:4px solid var(--line); border-radius:12px; font-size:16px; padding:10px 14px; cursor:pointer; min-height:48px; font-weight:bold; }
.strip{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px 0; }
.chip{ background:#fff; border:2px solid var(--line); border-radius:999px; padding:8px 12px; font-size:15px; font-weight:bold; color:var(--eel); }
.chip .flame{ color:#ff9600; } .chip .star{ color:#ffc800; } .chip .gem{ color:var(--blue); }
.card{ background:#fff; border:2px solid var(--line); border-radius:16px; padding:16px; margin:0 0 14px 0; }
.card h2{ color:var(--eel); margin:0 0 8px 0; font-size:20px; font-weight:800; }
.card h3{ color:var(--eel); margin:0 0 6px 0; font-size:17px; font-weight:800; }
.dim{ color:var(--dim); }
.btn{ display:block; width:100%; background:var(--green); color:#fff; border:none; border-bottom:5px solid var(--green-d); border-radius:14px; font-size:18px; font-weight:bold; padding:15px; margin:8px 0; cursor:pointer; min-height:56px; }
.btn:active{ transform:translateY(2px); border-bottom-width:2px; }
.btn.secondary{ background:#fff; color:var(--blue); border:2px solid var(--line); border-bottom:5px solid var(--line); }
.btn.good{ background:var(--green); }
.btn.bad{ background:var(--red); border-bottom-color:var(--red-d); color:#fff; }
.btn:disabled{ opacity:.45; }
.btn.qchoice.sel{ background:#ddf4ff; color:var(--blue-d); border-color:var(--blue); border-bottom-color:var(--blue-d); }
.lessonbtn{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; color:var(--eel); border:2px solid var(--line); border-bottom:5px solid var(--line); border-radius:14px; padding:14px; margin:6px 0; cursor:pointer; font-size:17px; font-weight:bold; min-height:56px; }
.lessonbtn .st{ margin-left:auto; color:var(--dim); font-size:15px; white-space:nowrap; }
.unithead{ border-radius:16px; padding:14px 16px; margin:18px 0 10px 0; color:#fff; }
.unithead h3{ margin:0; font-size:19px; font-weight:800; color:#fff; }
.unithead p{ margin:4px 0 0 0; font-size:14px; color:#fff; opacity:.92; }
.pathwrap{ display:flex; flex-direction:column; align-items:center; padding:6px 0 2px 0; }
.pnode{ width:76px; height:70px; border-radius:50%; border:none; border-bottom:7px solid rgba(0,0,0,.25); color:#fff; font-size:30px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; }
.pnode:active{ transform:translateY(3px); border-bottom-width:3px; }
.pnode.locked{ background:#e5e5e5 !important; border-bottom-color:#c9c9c9 !important; color:#afafaf; cursor:default; }
.pnode .starttag{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); background:#fff; color:inherit; border:2px solid var(--line); border-radius:10px; font-size:13px; font-weight:800; padding:2px 8px; letter-spacing:.5px; }
.pnode-label{ text-align:center; font-weight:bold; font-size:15px; margin-top:6px; color:var(--eel); }
.pnode-label .sub{ display:block; font-weight:normal; color:var(--dim); font-size:13px; }
.pulse{ animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(28,176,246,.45);} 70%{ box-shadow:0 0 0 14px rgba(28,176,246,0);} 100%{ box-shadow:0 0 0 0 rgba(28,176,246,0);} }
nav.tabs{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--line); display:flex; z-index:30; }
nav.tabs button{ flex:1; background:none; border:none; color:#afafaf; font-size:15px; font-weight:bold; padding:12px 2px 14px 2px; cursor:pointer; min-height:60px; }
nav.tabs button.active{ color:var(--blue); }
.progresswrap{ background:var(--line); border-radius:999px; height:16px; overflow:hidden; margin:10px 0; }
.progressbar{ background:linear-gradient(180deg,#7ee000,var(--green)); height:100%; width:0%; transition:width .3s; border-radius:999px; }
.qword{ font-size:32px; font-weight:800; text-align:center; margin:16px 0 4px 0; color:var(--eel); }
.qrom{ font-size:18px; color:var(--dim); text-align:center; margin:0 0 8px 0; }
.qprompt{ font-size:19px; font-weight:bold; text-align:left; color:var(--eel); margin:10px 0; }
.sheet{ display:none; position:fixed; left:0; right:0; bottom:60px; z-index:40; padding:16px 14px 12px 14px; }
.sheet.good{ display:block; background:#d7ffb8; color:#3d8b00; }
.sheet.bad{ display:block; background:#ffdfe0; color:#c81e1e; }
.sheet .fbtitle{ font-size:20px; font-weight:800; margin:0 0 4px 0; }
.sheet .fbtext{ font-size:16px; margin:0 0 8px 0; }
.sheet .btn{ margin:4px 0 2px 0; }
.sheet.good .btn{ background:var(--green); border-bottom-color:var(--green-d); }
.sheet.bad .btn{ background:var(--red); border-bottom-color:var(--red-d); }
.wordrow{ display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--line); border-bottom:4px solid var(--line); border-radius:12px; padding:12px; margin:6px 0; }
.wordrow .w{ flex:1; }
.wordrow .t{ font-size:19px; font-weight:bold; }
.wordrow .e{ color:var(--dim); font-size:15px; }
.mini{ background:#fff; color:var(--blue); border:2px solid var(--line); border-bottom:4px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; font-weight:bold; cursor:pointer; min-height:48px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; justify-content:center; }
.catchip{ background:#fff; color:var(--eel); border:2px solid var(--line); border-bottom:5px solid var(--line); border-radius:14px; padding:12px 16px; font-size:17px; font-weight:bold; cursor:pointer; min-height:52px; }
.catchip.active{ border-color:var(--blue); color:var(--blue); }
.catchip.tile{ font-size:26px; min-width:58px; min-height:66px; padding:10px 8px; }
.builtline{ min-height:44px; border:2px dashed var(--line); border-radius:12px; padding:10px; font-size:24px; font-weight:800; text-align:center; letter-spacing:2px; margin:8px 0; }
input[type=text],input[type=password],textarea{ width:100%; background:#f7f7f7; color:var(--eel); border:2px solid var(--line); border-radius:12px; padding:14px; font-size:17px; margin:6px 0; }
select{ width:100%; background:#f7f7f7; color:var(--eel); border:2px solid var(--line); border-radius:12px; padding:14px; font-size:17px; margin:6px 0; }
.badge{ display:inline-block; background:#fff8d6; border:2px solid #ffc800; color:#7a5b00; border-radius:12px; padding:8px 10px; margin:4px 4px 4px 0; font-size:14px; font-weight:bold; }
.badge.off{ color:#afafaf; border-color:var(--line); background:#fff; }
.view{ display:none; }
.view.active{ display:block; }
.big{ font-size:22px; }
.center{ text-align:center; }
a{ color:var(--blue); }
.mascot{ font-size:52px; line-height:1; }
.greetcard{ display:flex; gap:12px; align-items:center; }
.confetti{ position:fixed; top:-12px; width:10px; height:16px; z-index:50; border-radius:3px; animation:fall linear forwards; pointer-events:none; }
@keyframes fall{ to{ transform:translateY(105vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="lynxo-language-app">
  <header class="top">
    <h1>Lynxo Language Learning</h1>
    <button class="langbtn" id="langPickBtn" aria-label="Choose language">Spanish</button>
    <button class="iconbtn" id="accountBtn" aria-label="Account">Account</button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">Settings</button>
  </header>

  <main id="mainArea">
    <section class="view active" id="view-learn" aria-label="Learn"></section>
    <section class="view" id="view-vocab" aria-label="Vocabulary"></section>
    <section class="view" id="view-practice" aria-label="Practice"></section>
    <section class="view" id="view-progress" aria-label="Progress"></section>
    <section class="view" id="view-lesson" aria-label="Lesson"></section>
    <section class="view" id="view-account" aria-label="Account"></section>
    <section class="view" id="view-settings" aria-label="Settings"></section>
  </main>

  <nav class="tabs" aria-label="Main tabs">
    <button id="tab-learn" class="active">Learn</button>
    <button id="tab-vocab">Vocabulary</button>
    <button id="tab-practice">Practice</button>
    <button id="tab-progress">Progress</button>
  </nav>
</div>

<script>
"use strict";
var APP_VERSION_NAME = "1.1.0";
var APP_VERSION_CODE = 3;
var REPO = "justinyocum4-code/Lynxo-Language";
var SUPABASE_URL = "https://klykzghndlrfwwxwaczm.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseWt6Z2huZGxyZnd3eHdhY3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MzUxNDUsImV4cCI6MjEwNTExMTE0NX0.02AcmkbA_wjLN5XOfwuisJjck2TijjqH66bX5ddVV0Q";
var REDIRECT = "com.lynxolanguage.app://auth-callback";

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ var x = a.slice(); for(var i = x.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function todayStr(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

/* ---------------- Speech ---------------- */
function say(text){
  try { if(window.LynxosTts && LynxosTts.speak) { LynxosTts.speak(String(text)); return; } } catch(e){}
  try { var u = new SpeechSynthesisUtterance(String(text)); speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
/* Foreign-language speech: stream the pronunciation from a free web voice first
   (works for every language, even when the phone has no voice downloaded for it),
   and fall back to the phone's built-in voice when the web voice can't play. */
var _webAudio = null;
var _webQueue = [];
var _webPlaying = false;
var _lastSpeechNoteAt = 0;
function webTtsCode(tts){
  var b = String(tts || "en-US").split("-")[0].toLowerCase();
  if(b === "nb") return "no";
  if(b === "zh") return "zh-CN";
  return b;
}
function stopWebAudio(){
  _webQueue = []; _webPlaying = false;
  if(_webAudio){ try { _webAudio.pause(); } catch(e){} _webAudio = null; }
}
function speechNote(msg){
  try {
    var d = $("speechNote");
    if(!d){ d = document.createElement("div"); d.id = "speechNote";
      d.style.cssText = "position:fixed;left:12px;right:12px;bottom:86px;z-index:60;background:#1c1c1c;color:#ffd94d;border:1px solid #ffd94d;border-radius:12px;padding:12px 14px;font-size:16px;text-align:center;";
      document.body.appendChild(d);
    }
    d.textContent = msg; d.style.display = "block";
    clearTimeout(d._hideT); d._hideT = setTimeout(function(){ d.style.display = "none"; }, 7000);
  } catch(e){}
  say(msg);
}
function playWebQueue(){
  if(_webPlaying) return;
  var job = _webQueue.shift();
  if(!job) return;
  _webPlaying = true;
  var a = new Audio(job.url);
  _webAudio = a;
  try { a.playbackRate = job.rate; } catch(e){}
  var settled = false;
  var done = function(ok){
    if(settled) return; settled = true;
    if(_webAudio === a) _webAudio = null;
    _webPlaying = false;
    if(!ok && job.fallback) job.fallback();
    playWebQueue();
  };
  a.onended = function(){ done(true); };
  a.onerror = function(){ done(false); };
  var p = null;
  try { p = a.play(); } catch(e){ done(false); return; }
  if(p && p.catch) p.catch(function(){ done(false); });
}
function speakLang(text, lang, rate, queue){
  var r = rate || (state.settings.rate || 1);
  var tts = lang || curLang().tts;
  var nativeFn = function(){
    try { if(window.LynxosTts && LynxosTts.speakAs) { LynxosTts.speakAs(String(text), tts, r, !!queue); return; } } catch(e){}
    try { var u = new SpeechSynthesisUtterance(String(text)); u.lang = tts; u.rate = r; if(!queue) speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
  };
  if(!queue){
    stopWebAudio();
    try { if(window.LynxosTts && LynxosTts.stop) LynxosTts.stop(); } catch(e){}
    try { speechSynthesis.cancel(); } catch(e){}
  }
  var code = webTtsCode(tts);
  var chunks = [];
  var s = String(text);
  while(s.length > 180){ var cut = s.lastIndexOf(" ", 180); if(cut < 40) cut = 180; chunks.push(s.slice(0, cut)); s = s.slice(cut).trim(); }
  if(s) chunks.push(s);
  var failed = false;
  chunks.forEach(function(c, i){
    var url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + encodeURIComponent(code) + "&q=" + encodeURIComponent(c);
    _webQueue.push({ url: url, rate: r, fallback: (i === 0) ? function(){
      if(failed) return; failed = true;
      if(Date.now() - _lastSpeechNoteAt > 60000){
        _lastSpeechNoteAt = Date.now();
        speechNote("I could not play that pronunciation out loud. Check your internet connection, or download the voice for this language in your phone's text-to-speech settings.");
      }
      nativeFn();
    } : null });
  });
  playWebQueue();
}
var _sttCb = null;
function listenLang(lang, cb){
  _sttCb = cb;
  try { if(window.LynxosStt && LynxosStt.start) { LynxosStt.start(lang || curLang().tts); return; } } catch(e){}
  try {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR){ var rec = new SR(); rec.lang = lang || curLang().tts; rec.interimResults = false;
      rec.onresult = function(ev){ var t = ev.results[0][0].transcript || ""; if(_sttCb){ var c = _sttCb; _sttCb = null; c(t, true); } };
      rec.onerror = function(){ if(_sttCb){ var c = _sttCb; _sttCb = null; c("", false); } };
      rec.start(); return;
    }
  } catch(e){}
  if(_sttCb){ var c2 = _sttCb; _sttCb = null; c2("", false); }
}
window.__onStt = function(text, ok){ if(_sttCb){ var c = _sttCb; _sttCb = null; c(text || "", !!ok); } };

/* ---------------- State ---------------- */
var DEF_STATE = {
  lang: "es", xp: 0, lessonsDone: {}, stars: {}, mistakes: [], favs: [],
  srs: {}, badges: [], goalMin: 5, todayXp: 0, todayDate: "",
  streak: 0, lastDay: "", wotd: {}, settings: { rate: 0.85, reminder: false },
  groqKey: "", placement: {}, updatedAt: 0
};
var state = loadState();
function loadState(){
  try { var raw = localStorage.getItem("ll_state_v1"); if(raw){ var s = JSON.parse(raw); var out = JSON.parse(JSON.stringify(DEF_STATE)); for(var k in s) out[k] = s[k]; if(!out.settings) out.settings = { rate: 1, reminder: false }; return out; } } catch(e){}
  return JSON.parse(JSON.stringify(DEF_STATE));
}
var _syncTimer = null;
function saveState(){
  state.updatedAt = Date.now();
  try { localStorage.setItem("ll_state_v1", JSON.stringify(state)); } catch(e){}
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ cloudUpload(true); }, 4000);
}
function curLang(){ for(var i = 0; i < LANGS.length; i++) if(LANGS[i].code === state.lang) return LANGS[i]; return LANGS[0]; }
function langData(){ return LANGDATA[state.lang] || {}; }
function catList(){ return CATS; }
function itemKey(cat, idx){ return state.lang + ":" + cat + ":" + idx; }
function getItem(cat, idx){ var c = (langData().cats || {})[cat] || []; return c[idx] || null; }
function allItems(){
  var out = []; var cats = langData().cats || {};
  CATS.forEach(function(c){ (cats[c.id] || []).forEach(function(it, i){ out.push({ cat: c.id, idx: i, t: it[0], e: it[1], r: it[2] || "" }); }); });
  return out;
}
function rollDay(){
  var t = todayStr();
  if(state.todayDate !== t){
    if(state.lastDay){
      var y = new Date(); y.setDate(y.getDate() - 1);
      var ys = y.getFullYear() + "-" + ("0" + (y.getMonth() + 1)).slice(-2) + "-" + ("0" + y.getDate()).slice(-2);
      if(state.lastDay !== ys && state.lastDay !== t) state.streak = 0;
    }
    state.todayDate = t; state.todayXp = 0;
  }
}
function addXp(n){
  rollDay();
  state.xp += n; state.todayXp += n;
  var t = todayStr();
  if(state.lastDay !== t){
    var y = new Date(); y.setDate(y.getDate() - 1);
    var ys = y.getFullYear() + "-" + ("0" + (y.getMonth() + 1)).slice(-2) + "-" + ("0" + y.getDate()).slice(-2);
    state.streak = (state.lastDay === ys) ? state.streak + 1 : 1;
    state.lastDay = t;
  }
  checkBadges();
}
function level(){ return Math.floor(state.xp / 100) + 1; }
var BADGES = [
  { id: "first", name: "First Steps", test: function(){ return Object.keys(state.lessonsDone).length >= 1; } },
  { id: "xp100", name: "100 XP Club", test: function(){ return state.xp >= 100; } },
  { id: "xp500", name: "500 XP Club", test: function(){ return state.xp >= 500; } },
  { id: "streak3", name: "3 Day Streak", test: function(){ return state.streak >= 3; } },
  { id: "streak7", name: "7 Day Streak", test: function(){ return state.streak >= 7; } },
  { id: "poly", name: "Explorer", test: function(){ var s = {}; Object.keys(state.lessonsDone).forEach(function(k){ s[k.split(":")[0]] = 1; }); return Object.keys(s).length >= 2; } },
  { id: "words50", name: "50 Words Reviewed", test: function(){ return Object.keys(state.srs).length >= 50; } }
];
function checkBadges(){
  BADGES.forEach(function(b){ if(state.badges.indexOf(b.id) < 0 && b.test()){ state.badges.push(b.id); say("Badge earned: " + b.name); } });
}
function wordOfDay(){
  var t = todayStr();
  if(state.wotd.date === t && state.wotd.key) return state.wotd;
  var items = allItems(); if(!items.length) return null;
  var seed = 0; for(var i = 0; i < t.length; i++) seed += t.charCodeAt(i) * (i + 3);
  var it = items[seed % items.length];
  state.wotd = { date: t, key: it.cat + ":" + it.idx, t: it.t, e: it.e, r: it.r };
  saveState();
  return state.wotd;
}
</script>
<script>
"use strict";
/* ---------------- Navigation ---------------- */
var VIEWS = ["learn","vocab","practice","progress","lesson","account","settings"];
function show(view){
  VIEWS.forEach(function(v){ var el = $("view-" + v); if(el) el.classList.toggle("active", v === view); });
  ["learn","vocab","practice","progress"].forEach(function(t){ var b = $("tab-" + t); if(b) b.classList.toggle("active", t === view); });
  if(view === "learn") renderLearn();
  if(view === "vocab") renderVocab();
  if(view === "practice") renderPractice();
  if(view === "progress") renderProgress();
  if(view === "account") renderAccount();
  if(view === "settings") renderSettings();
  try { window.scrollTo(0, 0); } catch(e){}
}
$("tab-learn").addEventListener("click", function(){ show("learn"); say("Learn tab. " + curLang().name + "."); });
$("tab-vocab").addEventListener("click", function(){ show("vocab"); say("Vocabulary tab."); });
$("tab-practice").addEventListener("click", function(){ show("practice"); say("Practice tab."); });
$("tab-progress").addEventListener("click", function(){ show("progress"); say("Progress tab."); });
$("accountBtn").addEventListener("click", function(){ show("account"); });
$("settingsBtn").addEventListener("click", function(){ show("settings"); });
$("langPickBtn").addEventListener("click", openLangPicker);

function openLangPicker(){
  var html = "<button class='btn secondary' id='lpBack'>Back</button><div class='card'><h2>Choose a language</h2><p class='dim'>You can learn more than one and switch any time. Your progress in each language is saved separately.</p>";
  LANGS.forEach(function(l){ html += "<button class='lessonbtn' data-lang='" + l.code + "'><span>" + esc(l.name) + "</span><span class='st'>" + esc(l.native) + (state.lang === l.code ? " &bull; current" : "") + "</span></button>"; });
  html += "</div>";
  var v = $("view-learn"); v.innerHTML = html;
  VIEWS.forEach(function(x){ var el = $("view-" + x); if(el) el.classList.toggle("active", x === "learn"); });
  $("lpBack").addEventListener("click", function(){ show("learn"); });
  Array.prototype.forEach.call(v.querySelectorAll("[data-lang]"), function(b){
    b.addEventListener("click", function(){
      state.lang = b.getAttribute("data-lang"); saveState();
      $("langPickBtn").textContent = curLang().name;
      say("Language set to " + curLang().name + ".");
      show("learn");
    });
  });
  say("Choose a language. " + LANGS.length + " languages available.");
}

/* ---------------- Learn (path) ---------------- */
function lessonId(cat, part){ return state.lang + ":" + cat + ":" + part; }
function isUnlocked(catIdx, part){
  if(catIdx === 0 && part === 0) return true;
  var prev = lessonList();
  for(var i = 0; i < prev.length; i++){

  bumpSrs(key, ok);
  if(ok){
    LSN.correct++;
    var mi = state.mistakes.indexOf(key); if(mi >= 0) state.mistakes.splice(mi, 1);
    sndGood();
    if(sheet) sheet.className = "sheet good";
    if(title) title.innerHTML = "&#127881; " + pick(PRAISE);
    fb.innerHTML = "<b>" + esc(q.item.t) + "</b> means <b>" + esc(q.item.e) + "</b>.";
    say(pick(PRAISE));
    speakLang(q.item.t, curLang().tts, 0.9);
  } else {
    if(state.mistakes.indexOf(key) < 0) state.mistakes.push(key);
    sndBad();
    if(sheet) sheet.className = "sheet bad";
    if(title) title.textContent = pick(ENCOURAGE);
    fb.innerHTML = "The answer is <b>" + esc(q.item.t) + "</b> — <b>" + esc(q.item.e) + "</b>. It is saved in your Mistakes review.";
    say(pick(ENCOURAGE) + " The answer is " + q.item.e + ".");
    if(q.type === "spellbuild"){ var it = q.item; setTimeout(function(){ spellWordSpeak(it); }, 2200); }
    else speakLang(q.item.t, curLang().tts, 0.8);
  }
  saveState();
  var nx = $("qNext"); if(nx){ nx.style.display = "block"; nx.focus(); }
}
function bumpSrs(key, ok){
  var b = state.srs[key] || 0;
  state.srs[key] = ok ? Math.min(5, b + 1) : 0;
}
function nextQuestion(){
  LSN.i++;
  if(LSN.i >= LSN.qs.length){ finishSession(); return; }
  renderQuestion();
}
function finishSession(){
  var total = LSN.qs.length, correct = LSN.correct;
  var xpGain = correct * 2 + (correct === total ? 5 : 0);
  var stars = correct === total ? 3 : (correct >= total * 0.7 ? 2 : (correct >= total * 0.4 ? 1 : 0));
  var msg = "";
  if(LSN.mode === "lesson"){
    state.lessonsDone[LSN.lesson.id] = true;
    if((state.stars[LSN.lesson.id] || 0) < stars) state.stars[LSN.lesson.id] = stars;
    addXp(xpGain);
    msg = LSN.lesson.title + " complete. You got " + correct + " of " + total + " right and earned " + xpGain + " XP.";
  } else if(LSN.mode === "placement"){
    state.placement[state.lang] = correct;
    if(correct >= 7){
      var lessons = lessonList();
      lessons.slice(0, 4).forEach(function(l){ state.lessonsDone[l.id] = true; if(!state.stars[l.id]) state.stars[l.id] = 2; });
      msg = "Placement done. You scored " + correct + " of " + total + " — strong start. I marked the first few lessons done so you start further along the path.";
    } else {
      msg = "Placement done. You scored " + correct + " of " + total + ". The path starts at the beginning, which is the right place to build from.";
    }
    addXp(correct * 2);
  } else {
    addXp(correct * 2);
    msg = (LSN.mode === "spelling" ? "Spelling practice complete. " : "Review complete. ") + correct + " of " + total + " right. Anything you missed stays in the list for next time.";
  }
  saveState();
  sndFanfare();
  if(LSN.mode === "lesson") confettiBurst();
  var v = $("view-lesson");
  var spellBtn = (LSN.mode === "lesson") ? "<button class='btn secondary' id='finSpell'>Spelling round for this lesson</button>" : "";
  var doneCat = LSN.lesson.cat, doneMode = LSN.mode;
  v.innerHTML = "<div class='card center'><div class='mascot' aria-hidden='true'>&#128006;</div><h2>Session complete!</h2><p class='big'>" + esc(msg) + "</p><p class='dim'>Total XP: " + state.xp + " &bull; Streak: " + state.streak + " days</p>" + spellBtn + "<button class='btn' id='finBtn'>Back to Learn</button></div>";
  $("finBtn").addEventListener("click", function(){ LSN = null; show("learn"); });
  var fs = $("finSpell"); if(fs) fs.addEventListener("click", function(){ startSpelling(doneCat); });
  say(msg + (doneMode === "lesson" ? " There is a spelling round for this lesson when you are ready." : ""));
}
</script>
<script>
"use strict";
/* ---------------- Vocabulary ---------------- */

var FC = null;
function startFlashcards(){
  var items = ((langData().cats || {})[vocabCat] || []).map(function(it, i){ return { idx: i, t: it[0], e: it[1], r: it[2] || "" }; });
  if(!items.length) return;
  FC = { items: shuffle(items), i: 0, flipped: false };
  show("lesson");
  renderFlash();
}
function renderFlash(){
  var it = FC.items[FC.i];
  var v = $("view-lesson");
  v.innerHTML = "<button class='btn secondary' id='fcQuit'>Back to Vocabulary</button>" +
    "<div class='card center'><p class='dim'>Flashcard " + (FC.i + 1) + " of " + FC.items.length + "</p>" +
    (FC.flipped ? "<p class='qword'>" + esc(it.e) + "</p>" : "<p class='qword'>" + esc(it.t) + "</p>" + (it.r ? "<p class='qrom'>" + esc(it.r) + "</p>" : "")) +
    "<button class='btn' id='fcHear'>Hear it</button>" +
    "<button class='btn secondary' id='fcFlip'>" + (FC.flipped ? "Show the word again" : "Show the meaning") + "</button>" +
    "<div style='display:flex;gap:8px'><button class='btn bad' id='fcMiss' style='flex:1'>I missed it</button><button class='btn good' id='fcKnow' style='flex:1'>I knew it</button></div></div>";
  $("fcQuit").addEventListener("click", function(){ FC = null; show("vocab"); });
  $("fcHear").addEventListener("click", function(){ speakLang(it.t, curLang().tts, 0.9); });
  $("fcFlip").addEventListener("click", function(){ FC.flipped = !FC.flipped; renderFlash(); if(FC.flipped) say(it.e); });
  var step = function(ok){
    bumpSrs(itemKey(vocabCat, it.idx), ok);
    if(!ok){ var k = itemKey(vocabCat, it.idx); if(state.mistakes.indexOf(k) < 0) state.mistakes.push(k); }
    else { var k2 = itemKey(vocabCat, it.idx); var mi = state.mistakes.indexOf(k2); if(mi >= 0) state.mistakes.splice(mi, 1); }
    saveState();
    FC.i++; FC.flipped = false;
    if(FC.i >= FC.items.length){ FC = null; say("Flashcards done."); show("vocab"); } else renderFlash();
  };
  $("fcKnow").addEventListener("click", function(){ step(true); });
  $("fcMiss").addEventListener("click", function(){ step(false); });
  speakLang(it.t, curLang().tts, 0.9);
}

/* ---------------- Practice hub ---------------- */
function renderPractice(){
  var html = "<div class='card'><h2>Practice — " + esc(curLang().name) + "</h2><p class='dim'>Extra ways to practice, like Duolingo's practice hub.</p></div>";

  html += "<div class='card'><h3>&#9999;&#65038; Spelling practice</h3><p class='dim'>Learn to spell the words, not just hear them. The app spells each word out loud, then you build it from letter tiles that speak when you touch them.</p><button class='btn' id='pSpell'>Start spelling practice</button></div>";
  html += "<div class='card'><h3>Mistakes review</h3><p class='dim'>" + state.mistakes.length + " saved mistake" + (state.mistakes.length === 1 ? "" : "s") + " in " + esc(curLang().name) + ".</p><button class='btn' id='pMistakes'>Review mistakes</button></div>";
  html += "<div class='card'><h3>Stories and dialogues</h3><p class='dim'>Short spoken conversations built from your phrases, with questions after.</p><button class='btn' id='pStory'>Play a dialogue</button></div>";
  html += "<div class='card'><h3>Phrasebook</h3><p class='dim'>Everyday phrases with favorites. Your saved phrases come first.</p><button class='btn' id='pPhrases'>Open phrasebook</button></div>";
  html += "<div class='card'><h3>Translator</h3><p class='dim'>Type or say something in English and hear it in " + esc(curLang().name) + ". Uses the internet.</p><button class='btn' id='pTrans'>Open translator</button></div>";
  html += "<div class='card'><h3>Conversation practice</h3><p class='dim'>Guided roleplay conversations — no key needed. If you add your own Groq key in Settings, this also unlocks free AI chat.</p><button class='btn' id='pConvo'>Start a conversation</button></div>";
  $("view-practice").innerHTML = html;
  $("pAudio").addEventListener("click", startAudioLesson);
  $("pAudioStop").addEventListener("click", stopAudioLesson);
  $("pSpell").addEventListener("click", function(){ startSpelling(); });
  $("pMistakes").addEventListener("click", startMistakes);
  $("pStory").addEventListener("click", startDialogue);
  $("pPhrases").addEventListener("click", renderPhrasebook);
  $("pTrans").addEventListener("click", renderTranslator);
  $("pConvo").addEventListener("click", renderConvo);
}
var _audioTimers = [];
function stopAudioLesson(){
  _audioTimers.forEach(function(t){ clearTimeout(t); }); _audioTimers = [];
  stopWebAudio();
  try { if(window.LynxosTts && LynxosTts.stop) LynxosTts.stop(); } catch(e){}
  try { speechSynthesis.cancel(); } catch(e){}
}
function startAudioLesson(){
  stopAudioLesson();
  var items = shuffle(allItems()).slice(0, 10);
  if(!items.length) return;
  say("Audio lesson. Ten words and phrases. Listen, then repeat after the slow version.");
  var delay = 2500;
  items.forEach(function(it, n){
    _audioTimers.push(setTimeout(function(){ say("Number " + (n + 1) + ". In English: " + it.e); }, delay)); delay += 2600;
    _audioTimers.push(setTimeout(function(){ speakLang(it.t, curLang().tts, 0.55, true); }, delay)); delay += 3200;
    _audioTimers.push(setTimeout(function(){ speakLang(it.t, curLang().tts, 1, true); }, delay)); delay += 3400;
  });
  _audioTimers.push(setTimeout(function(){ say("Audio lesson complete. Good work."); addXp(10); saveState(); }, delay));
}
function renderPhrasebook(){
  var phrases = ((langData().cats || {}).phrases || []).map(function(it, i){ return { idx: i, t: it[0], e: it[1], r: it[2] || "" }; });
  var favSet = {}; state.favs.forEach(function(k){ favSet[k] = 1; });
  phrases.sort(function(a, b){ var fa = favSet[itemKey("phrases", a.idx)] ? 0 : 1; var fb = favSet[itemKey("phrases", b.idx)] ? 0 : 1; return fa - fb; });
  var html = "<button class='btn secondary' id='pbBack'>Back to Practice</button><div class='card'><h2>Phrasebook — " + esc(curLang().name) + "</h2></div>";
  phrases.forEach(function(p){
    var fav = !!favSet[itemKey("phrases", p.idx)];
    html += "<div class='wordrow'><div class='w'><div class='t'>" + esc(p.t) + "</div><div class='e'>" + esc(p.e) + (p.r ? " &bull; " + esc(p.r) : "") + "</div></div><button class='mini' data-psay='" + p.idx + "'>Hear</button><button class='mini' data-pfav='" + p.idx + "'>" + (fav ? "Saved" : "Save") + "</button></div>";
  });
  $("view-practice").innerHTML = html;
  $("pbBack").addEventListener("click", function(){ show("practice"); });
  Array.prototype.forEach.call($("view-practice").querySelectorAll("[data-psay]"), function(b){ b.addEventListener("click", function(){ var it = getItem("phrases", parseInt(b.getAttribute("data-psay"), 10)); if(it) speakLang(it[0], curLang().tts, 0.9); }); });
  Array.prototype.forEach.call($("view-practice").querySelectorAll("[data-pfav]"), function(b){ b.addEventListener("click", function(){
    var key = itemKey("phrases", parseInt(b.getAttribute("data-pfav"), 10));
    var i = state.favs.indexOf(key); if(i >= 0) state.favs.splice(i, 1); else state.favs.push(key);
    saveState(); renderPhrasebook();
  }); });
  say("Phrasebook. " + phrases.length + " phrases.");
}
function startDialogue(){
  var phrases = ((langData().cats || {}).phrases || []);
  var greet = ((langData().cats || {}).greet || []);
  if(phrases.length < 5 || greet.length < 3){ say("Not enough phrases for a dialogue yet."); return; }
  var lines = [
    { who: "Ana", item: greet[0] }, { who: "Ben", item: greet[0] },
    { who: "Ana", item: phrases[0] }, { who: "Ben", item: phrases[1] },
    { who: "Ana", item: phrases[5] }, { who: "Ben", item: phrases[6] },
    { who: "Ana", item: phrases[3] }, { who: "Ben", item: greet[3] },
    { who: "Ana", item: phrases[8] }
  ];
  var v = $("view-lesson");
  VIEWS.forEach(function(x){ var el = $("view-" + x); if(el) el.classList.toggle("active", x === "lesson"); });
  var html = "<button class='btn secondary' id='dQuit'>Back</button><div class='card'><h2>A short dialogue</h2><p class='dim'>Ana and Ben meet. Listen to each line — English is shown after each one.</p>";
  lines.forEach(function(l, i){ html += "<p><b>" + l.who + ":</b> " + esc(l.item[0]) + (l.item[2] ? " (" + esc(l.item[2]) + ")" : "") + "<br><span class='dim'>" + esc(l.item[1]) + "</span></p>"; });
  html += "<button class='btn' id='dPlay'>Play the dialogue</button><button class='btn secondary' id='dQuiz'>Answer questions about it</button></div>";
  v.innerHTML = html;
  $("dQuit").addEventListener("click", function(){ show("practice"); });
  $("dPlay").addEventListener("click", function(){
    stopAudioLesson();
    var delay = 300;
    lines.forEach(function(l){ _audioTimers.push(setTimeout(function(){ speakLang(l.item[0], curLang().tts, 0.9, true); }, delay)); delay += Math.max(1800, l.item[0].length * 130); });
  });
  $("dQuiz").addEventListener("click", function(){
    var qs = [
      { type: "chooseEnglish", item: { cat: "phrases", idx: 5, t: phrases[5][0], e: phrases[5][1], r: phrases[5][2] || "" }, distract: shuffle(phrases.map(function(y, yi){ return { t: y[0], e: y[1], r: y[2] || "", idx: yi }; }).filter(function(y){ return y.idx !== 5; })).slice(0, 3) },
      { type: "chooseEnglish", item: { cat: "phrases", idx: 0, t: phrases[0][0], e: phrases[0][1], r: phrases[0][2] || "" }, distract: shuffle(phrases.map(function(y, yi){ return { t: y[0], e: y[1], r: y[2] || "", idx: yi }; }).filter(function(y){ return y.idx !== 0; })).slice(0, 3) }
    ];

    renderQuestion();
    say("Two questions about the dialogue.");
  });
  say("A short dialogue between Ana and Ben. Tap play to listen.");
}
function renderTranslator(){
  var html = "<button class='btn secondary' id='tBack'>Back to Practice</button><div class='card'><h2>Translator</h2>" +
    "<p class='dim'>English to " + esc(curLang().name) + ". Type or dictate, then tap Translate. Needs internet.</p>" +
    "<label for='tIn'>English text</label><input type='text' id='tIn' placeholder='Type English here'>" +
    "<button class='btn secondary' id='tMic'>Dictate in English</button>" +
    "<button class='btn' id='tGo'>Translate</button>" +
    "<p class='qword' id='tOut'></p><p class='dim center' id='tStatus'></p>" +
    "<button class='btn secondary' id='tHear' style='display:none'>Hear the translation</button></div>";
  $("view-practice").innerHTML = html;
  $("tBack").addEventListener("click", function(){ show("practice"); });

    say("Listening.");

    var q = $("tIn").value.trim(); if(!q){ say("Type something first."); return; }

      .then(function(r){ return r.json(); })
      .then(function(d){
        var out = d && d.responseData && d.responseData.translatedText;
        if(out){ lastOut = out; $("tOut").textContent = out; $("tStatus").textContent = ""; $("tHear").style.display = "block"; speakLang(out, curLang().tts, 0.9); }
        else { $("tStatus").textContent = "No translation came back. Check your connection."; say("Translation failed."); }
      })
      .catch(function(){ $("tStatus").textContent = "Translation failed. Check your connection."; say("Translation failed."); });
  });
  $("tHear").addEventListener("click", function(){ if(lastOut) speakLang(lastOut, curLang().tts, 0.85); });
}
function renderConvo(){
  var scenarios = [
    { title: "At a café", lines: [["Waiter", "phrases", 5], ["You", "phrases", 6], ["Waiter", "greet", 3], ["You", "phrases", 8]] },
    { title: "Meeting someone new", lines: [["Ana", "greet", 0], ["You", "phrases", 0], ["Ana", "phrases", 3], ["You", "greet", 9]] },
    { title: "Asking for help", lines: [["You", "phrases", 7], ["Ben", "phrases", 3], ["You", "phrases", 4], ["Ben", "greet", 2]] }
  ];
  var html = "<button class='btn secondary' id='cBack'>Back to Practice</button><div class='card'><h2>Conversation practice</h2><p class='dim'>Guided roleplays in " + esc(curLang().name) + ". Each line is spoken; your lines are marked You.</p></div>";
  scenarios.forEach(function(s, si){ html += "<button class='lessonbtn' data-sc='" + si + "'><span>" + esc(s.title) + "</span><span class='st'>Play</span></button>"; });
  if(state.groqKey){
    html += "<div class='card'><h3>Free AI chat</h3><label for='aiIn'>Say something in " + esc(curLang().name) + " (or English)</label><input type='text' id='aiIn' placeholder='Type a message'><button class='btn' id='aiSend'>Send</button><p id='aiOut' class='dim'></p><button class='btn secondary' id='aiHear' style='display:none'>Hear the reply</button></div>";
  } else {
    html += "<div class='card'><h3>Free AI chat</h3><p class='dim'>Locked. Add your own Groq key in Settings to unlock open-ended AI conversation. The guided roleplays above always work, no key needed.</p></div>";
  }
  $("view-practice").innerHTML = html;
  $("cBack").addEventListener("click", function(){ show("practice"); });
  Array.prototype.forEach.call($("view-practice").querySelectorAll("[data-sc]"), function(b){
    b.addEventListener("click", function(){
      var s = scenarios[parseInt(b.getAttribute("data-sc"), 10)];
      stopAudioLesson();
      say(s.title + ". Listen.");
      var delay = 600;
      s.lines.forEach(function(L){
        var it = getItem(L[1], L[2]); if(!it) return;
        _audioTimers.push(setTimeout(function(){ say(L[0] + " says:"); }, delay)); delay += 1200;
        _audioTimers.push(setTimeout(function(){ speakLang(it[0], curLang().tts, 0.9, true); }, delay)); delay += Math.max(2000, it[0].length * 140);
      });
      _audioTimers.push(setTimeout(function(){ say("Conversation finished."); addXp(5); saveState(); }, delay));
    });
  });
  var send = $("aiSend");
  if(send) send.addEventListener("click", function(){
    var msg = $("aiIn").value.trim(); if(!msg) return;
    var out = $("aiOut"); out.textContent = "Thinking…";
    fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.groqKey },
      body: JSON.stringify({ model: "openai/gpt-oss-20b", messages: [
        { role: "system", content: "You are a friendly " + curLang().name + " conversation tutor for a beginner. Reply mostly in " + curLang().name + ", keep replies to 1-2 short sentences, then give the English translation in parentheses." },
        { role: "user", content: msg }
      ] })
    }).then(function(r){ return r.json(); }).then(function(d){
      var txt = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if(txt){ out.textContent = txt; $("aiHear").style.display = "block"; $("aiHear").onclick = function(){ speakLang(txt.split("(")[0], curLang().tts, 0.9); }; say("Reply received."); }
      else { out.textContent = "No reply. Check your key in Settings."; }
    }).catch(function(){ out.textContent = "AI chat failed. Check your connection and key."; });
  });
}

/* ---------------- Progress ---------------- */
function renderProgress(){
  rollDay();
  var doneCount = Object.keys(state.lessonsDone).length;
  var goalXp = state.goalMin * 2;
  var html = "<div class='card'><h2>Your progress</h2>" +
    "<p class='big'>Level " + level() + " &bull; " + state.xp + " XP</p>" +
    "<p>Streak: <b>" + state.streak + " day" + (state.streak === 1 ? "" : "s") + "</b></p>" +
    "<p>Lessons completed: <b>" + doneCount + "</b></p>" +
    "<p>Words in training: <b>" + Object.keys(state.srs).length + "</b></p>" +
    "<p>Saved phrases and words: <b>" + state.favs.length + "</b></p>" +
    "<p>Daily goal: " + state.goalMin + " minutes (about " + goalXp + " XP). Today: " + state.todayXp + " XP" + (state.todayXp >= goalXp ? " — goal reached, nice work." : ".") + "</p></div>";
  html += "<div class='card'><h2>Badges</h2>";

/* ---------------- Account + cloud sync ---------------- */
function sbTokens(){ try { var t = localStorage.getItem("ll_sb_tokens"); return t ? JSON.parse(t) : null; } catch(e){ return null; } }
function sbSaveTokens(a, r){ try { localStorage.setItem("ll_sb_tokens", JSON.stringify({ access: a, refresh: r })); } catch(e){} }
function sbClear(){ try { localStorage.removeItem("ll_sb_tokens"); localStorage.removeItem("ll_sb_user"); } catch(e){} }
function sbUser(){ try { var u = localStorage.getItem("ll_sb_user"); return u ? JSON.parse(u) : null; } catch(e){ return null; } }
function startGoogleLogin(){
  var url = SUPABASE_URL + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(REDIRECT);
  say("Opening Google sign-in in your browser. Finish there, then come back to the app.");
  window.location.href = url;
}
window.handleAuthCallback = function(url){
  if(!url) return;
  try {
    var hash = url.split("#")[1] || "";
    var params = {};
    hash.split("&").forEach(function(p){ var kv = p.split("="); if(kv[0]) params[kv[0]] = decodeURIComponent(kv.slice(1).join("=") || ""); });
    if(params.access_token && params.refresh_token){
      sbSaveTokens(params.access_token, params.refresh_token);
      say("Signed in. Loading your account.");
      fetchUserInfo(function(){ cloudDownload(function(){ show("account"); }); });
    } else if(url.indexOf("error") >= 0){ say("Sign-in was cancelled or failed."); }
  } catch(e){}
};
function fetchUserInfo(cb){
  var t = sbTokens(); if(!t){ if(cb) cb(); return; }
  fetch(SUPABASE_URL + "/auth/v1/user", { headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + t.access } })
    .then(function(r){ return r.json(); })
    .then(function(u){ if(u && u.id){ try { localStorage.setItem("ll_sb_user", JSON.stringify(u)); } catch(e){} } else sbClear(); if(cb) cb(); })
    .catch(function(){ if(cb) cb(); });
}
function cloudUpload(quiet){
  var t = sbTokens(); var u = sbUser();
  if(!t || !u) return;
  var payload = { user_id: u.id, data: state, updated_at: new Date(state.updatedAt || Date.now()).toISOString() };
  fetch(SUPABASE_URL + "/rest/v1/lynxo_language_progress?on_conflict=user_id", {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + t.access, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
    body: JSON.stringify(payload)
  }).then(function(r){ if(!quiet) say(r.ok ? "Progress saved to your account." : "Cloud save failed — your progress is still saved on this device."); })
    .catch(function(){ if(!quiet) say("Cloud save failed — your progress is still saved on this device."); });
}
function cloudDownload(cb){
  var t = sbTokens(); var u = sbUser();
  if(!t || !u){ if(cb) cb(false); return; }
  fetch(SUPABASE_URL + "/rest/v1/lynxo_language_progress?user_id=eq." + u.id + "&select=data,updated_at", {
    headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + t.access }
  }).then(function(r){ return r.json(); }).then(function(rows){
    if(rows && rows.length && rows[0].data){
      var cloud = rows[0].data;
      if((cloud.updatedAt || 0) > (state.updatedAt || 0) && (cloud.xp || 0) > 0){
        var keepSettings = state.settings; state = cloud; if(!state.settings) state.settings = keepSettings;
        try { localStorage.setItem("ll_state_v1", JSON.stringify(state)); } catch(e){}
        $("langPickBtn").textContent = curLang().name;
        if(cb) cb(true); return;
      }
    }
    if(cb) cb(false);
  }).catch(function(){ if(cb) cb(false); });
}
function renderAccount(){
  var u = sbUser(); var t = sbTokens();
  var html = "<button class='btn secondary' id='accBack'>Back</button><div class='card center'>";
  if(u && t){
    var name = (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || u.email || "Signed in";
    html += "<h2>Account</h2><p class='big'>" + esc(name) + "</p><p class='dim'>" + esc(u.email || "") + "</p>" +
      "<p>Your progress saves to this account automatically. Sign in on another device with the same Google account and it follows you.</p>" +
      "<button class='btn' id='syncBtn'>Sync now</button><button class='btn secondary' id='outBtn'>Sign out</button>";
  } else {
    html += "<h2>Sign in</h2><p>Sign in with Google so your progress is saved to your account and never lost — even if you reinstall or change phones.</p>" +
      "<button class='btn' id='inBtn'>Sign in with Google</button>" +
      "<p class='dim'>The app works without signing in too — progress just stays on this device until you do.</p>";
  }
  html += "</div>";
  $("view-account").innerHTML = html;
  $("accBack").addEventListener("click", function(){ show("learn"); });
  var inB = $("inBtn"); if(inB) inB.addEventListener("click", startGoogleLogin);
  var outB = $("outBtn"); if(outB) outB.addEventListener("click", function(){ sbClear(); say("Signed out."); renderAccount(); });
  var syB = $("syncBtn"); if(syB) syB.addEventListener("click", function(){ cloudUpload(false); });
}

window.__onUpdateStatus = function(s){
  var el = $("updStatus"); if(el) el.textContent = "Update: " + s;
  if(s === "downloading") say("Downloading the update.");
  else if(s.indexOf("downloading:") === 0) { /* progress ticks: keep quiet */ }
  else if(s === "installing" || s === "launched") say("Opening the installer. Tap Install when it appears.");
  else if(s === "need_permission") say("The app needs permission to install updates. Allow it on the screen that opened, then check for updates again.");
  else if(s.indexOf("error") === 0) say("Update failed. Check your connection and try again.");
};
function checkForUpdates(){
  var el = $("updStatus"); if(el) el.textContent = "Checking…";
  say("Checking for updates.");
  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", { headers: { "Accept": "application/vnd.github+json" } })
    .then(function(r){ return r.json(); })
    .then(function(rel){
      var tag = rel && rel.tag_name ? rel.tag_name : "";
      var m = tag.match(/\+(\d+)$/);
      var code = m ? parseInt(m[1], 10) : 0;
      if(code > APP_VERSION_CODE){
        var asset = (rel.assets || []).filter(function(a){ return /\.apk$/i.test(a.name); })[0];
        if(!asset){ if(el) el.textContent = "A new version exists but has no install file yet."; return; }
        if(el) el.textContent = "Update available: " + tag + ". Downloading…";
        say("Update available. Downloading it now.");
        try { LynxosUpdater.downloadAndInstall(asset.browser_download_url); }
        catch(e){ if(el) el.textContent = "Updater not available in this build."; }
      } else {
        if(el) el.textContent = "You are on the latest version (" + APP_VERSION_NAME + ").";
        say("You are on the latest version.");
      }
    })
    .catch(function(){ if(el) el.textContent = "Could not check. Check your connection."; say("Could not check for updates."); });
}

  if(LSN){ LSN = null; show("learn"); return "handled"; }

};
