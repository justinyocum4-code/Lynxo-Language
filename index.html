<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynxo Language Learning</title>
<style>
:root{ --gold:#f5c518; --gold-dim:#b8912a; --bg:#000; --card:#161616; --card2:#1f1f1f; --text:#fff; --dim:#bdbdbd; --good:#37d67a; --bad:#ff5a5a; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:Roboto,Arial,sans-serif; }
button{ font-family:inherit; }
:focus{ outline:3px solid var(--gold); outline-offset:2px; }
#lynxo-language-app{ max-width:860px; margin:0 auto; padding:0 12px 90px 12px; }
header.top{ display:flex; align-items:center; gap:8px; padding:12px 2px 8px 2px; position:sticky; top:0; background:var(--bg); z-index:20; }
header.top h1{ font-size:20px; color:var(--gold); margin:0; flex:1; line-height:1.15; }
.iconbtn{ background:var(--card2); color:var(--gold); border:2px solid var(--gold-dim); border-radius:12px; font-size:15px; padding:10px 12px; cursor:pointer; min-height:48px; }
.langbtn{ background:var(--card2); color:#fff; border:2px solid var(--gold); border-radius:12px; font-size:16px; padding:10px 14px; cursor:pointer; min-height:48px; font-weight:bold; }
.strip{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px 0; }
.chip{ background:var(--card); border:1px solid #333; border-radius:999px; padding:8px 12px; font-size:15px; color:var(--text); }
.chip b{ color:var(--gold); }
.card{ background:var(--card); border:1px solid #2c2c2c; border-radius:16px; padding:16px; margin:0 0 14px 0; }
.card h2{ color:var(--gold); margin:0 0 8px 0; font-size:19px; }
.card h3{ color:var(--gold); margin:0 0 6px 0; font-size:17px; }
.dim{ color:var(--dim); }
.btn{ display:block; width:100%; background:var(--gold); color:#000; border:none; border-radius:14px; font-size:18px; font-weight:bold; padding:16px; margin:8px 0; cursor:pointer; min-height:56px; }
.btn.secondary{ background:var(--card2); color:var(--gold); border:2px solid var(--gold-dim); }
.btn.good{ background:var(--good); }
.btn.bad{ background:var(--bad); color:#000; }
.btn:disabled{ opacity:.45; }
.lessonbtn{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card2); color:#fff; border:2px solid #333; border-radius:14px; padding:14px; margin:6px 0; cursor:pointer; font-size:17px; min-height:56px; }
.lessonbtn.current{ border-color:var(--gold); }
.lessonbtn.locked{ opacity:.45; }
.lessonbtn .st{ margin-left:auto; color:var(--gold); font-size:15px; white-space:nowrap; }
.unithead{ background:linear-gradient(90deg,#2a2103,#161616); border:1px solid var(--gold-dim); border-radius:14px; padding:12px 14px; margin:16px 0 6px 0; }
.unithead h3{ margin:0; color:var(--gold); font-size:18px; }
.unithead p{ margin:4px 0 0 0; color:var(--dim); font-size:14px; }
nav.tabs{ position:fixed; left:0; right:0; bottom:0; background:#0a0a0a; border-top:2px solid var(--gold-dim); display:flex; z-index:30; }
nav.tabs button{ flex:1; background:none; border:none; color:var(--dim); font-size:15px; padding:12px 2px 14px 2px; cursor:pointer; min-height:60px; }
nav.tabs button.active{ color:var(--gold); font-weight:bold; }
.progresswrap{ background:#222; border-radius:999px; height:18px; overflow:hidden; margin:10px 0; }
.progressbar{ background:var(--gold); height:100%; width:0%; transition:width .3s; }
.qword{ font-size:30px; font-weight:bold; text-align:center; margin:16px 0 4px 0; }
.qrom{ font-size:18px; color:var(--dim); text-align:center; margin:0 0 8px 0; }
.qprompt{ font-size:18px; text-align:center; color:var(--text); margin:8px 0; }
.feedback{ border-radius:14px; padding:14px; margin:12px 0; font-size:17px; display:none; }
.feedback.good{ background:#0d2b1a; border:2px solid var(--good); display:block; }
.feedback.bad{ background:#2b0d0d; border:2px solid var(--bad); display:block; }
.wordrow{ display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid #333; border-radius:12px; padding:12px; margin:6px 0; }
.wordrow .w{ flex:1; }
.wordrow .t{ font-size:19px; font-weight:bold; }
.wordrow .e{ color:var(--dim); font-size:15px; }
.mini{ background:#000; color:var(--gold); border:2px solid var(--gold-dim); border-radius:10px; padding:10px 12px; font-size:15px; cursor:pointer; min-height:48px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.catchip{ background:var(--card2); color:#fff; border:2px solid #333; border-radius:999px; padding:10px 14px; font-size:16px; cursor:pointer; min-height:48px; }
.catchip.active{ border-color:var(--gold); color:var(--gold); }
input[type=text],input[type=password],textarea{ width:100%; background:#0d0d0d; color:#fff; border:2px solid #444; border-radius:12px; padding:14px; font-size:17px; margin:6px 0; }
select{ width:100%; background:#0d0d0d; color:#fff; border:2px solid #444; border-radius:12px; padding:14px; font-size:17px; margin:6px 0; }
.badge{ display:inline-block; background:var(--card2); border:1px solid var(--gold-dim); color:var(--gold); border-radius:12px; padding:8px 10px; margin:4px 4px 4px 0; font-size:14px; }
.badge.off{ color:#666; border-color:#333; }
.view{ display:none; }
.view.active{ display:block; }
.big{ font-size:22px; }
.center{ text-align:center; }
a{ color:var(--gold); }
</style>
</head>
<body>
<div id="lynxo-language-app">
  <header class="top">
    <h1>Lynxo Language Learning</h1>
    <button class="langbtn" id="langPickBtn" aria-label="Choose language">Spanish</button>
    <button class="iconbtn" id="accountBtn" aria-label="Account">Account</button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">Settings</button>
  </header>

  <main id="mainArea">
    <section class="view active" id="view-learn" aria-label="Learn"></section>
    <section class="view" id="view-vocab" aria-label="Vocabulary"></section>

  <nav class="tabs" aria-label="Main tabs">
    <button id="tab-learn" class="active">Learn</button>
    <button id="tab-vocab">Vocabulary</button>
    <button id="tab-practice">Practice</button>
    <button id="tab-progress">Progress</button>
  </nav>
</div>

<script>
"use strict";
var APP_VERSION_NAME = "1.0.0";
var APP_VERSION_CODE = 1;
var REPO = "justinyocum4-code/Lynxo-Language";
var SUPABASE_URL = "https://klykzghndlrfwwxwaczm.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseWt6Z2huZGxyZnd3eHdhY3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MzUxNDUsImV4cCI6MjEwNTExMTE0NX0.02AcmkbA_wjLN5XOfwuisJjck2TijjqH66bX5ddVV0Q";
var REDIRECT = "com.lynxolanguage.app://auth-callback";

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ var x = a.slice(); for(var i = x.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function todayStr(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

/* ---------------- Speech ---------------- */
function say(text){
  try { if(window.LynxosTts && LynxosTts.speak) { LynxosTts.speak(String(text)); return; } } catch(e){}
  try { var u = new SpeechSynthesisUtterance(String(text)); speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
function speakLang(text, lang, rate, queue){
  var r = rate || (state.settings.rate || 1);
  try { if(window.LynxosTts && LynxosTts.speakAs) { LynxosTts.speakAs(String(text), lang || curLang().tts, r, !!queue); return; } } catch(e){}
  try { var u = new SpeechSynthesisUtterance(String(text)); u.lang = lang || curLang().tts; u.rate = r; if(!queue) speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
var _sttCb = null;
function listenLang(lang, cb){
  _sttCb = cb;
  try { if(window.LynxosStt && LynxosStt.start) { LynxosStt.start(lang || curLang().tts); return; } } catch(e){}
  try {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR){ var rec = new SR(); rec.lang = lang || curLang().tts; rec.interimResults = false;
      rec.onresult = function(ev){ var t = ev.results[0][0].transcript || ""; if(_sttCb){ var c = _sttCb; _sttCb = null; c(t, true); } };
      rec.onerror = function(){ if(_sttCb){ var c = _sttCb; _sttCb = null; c("", false); } };
      rec.start(); return;
    }
  } catch(e){}
  if(_sttCb){ var c2 = _sttCb; _sttCb = null; c2("", false); }
}
window.__onStt = function(text, ok){ if(_sttCb){ var c = _sttCb; _sttCb = null; c(text || "", !!ok); } };

/* ---------------- State ---------------- */
var DEF_STATE = {
  lang: "es", xp: 0, lessonsDone: {}, stars: {}, mistakes: [], favs: [],
  srs: {}, badges: [], goalMin: 5, todayXp: 0, todayDate: "",
  streak: 0, lastDay: "", wotd: {}, settings: { rate: 1, reminder: false },
  groqKey: "", placement: {}, updatedAt: 0
};
var state = loadState();
function loadState(){
  try { var raw = localStorage.getItem("ll_state_v1"); if(raw){ var s = JSON.parse(raw); var out = JSON.parse(JSON.stringify(DEF_STATE)); for(var k in s) out[k] = s[k]; if(!out.settings) out.settings = { rate: 1, reminder: false }; return out; } } catch(e){}
  return JSON.parse(JSON.stringify(DEF_STATE));
}
var _syncTimer = null;
function saveState(){
  state.updatedAt = Date.now();
  try { localStorage.setItem("ll_state_v1", JSON.stringify(state)); } catch(e){}
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ cloudUpload(true); }, 4000);
}
function curLang(){ for(var i = 0; i < LANGS.length; i++) if(LANGS[i].code === state.lang) return LANGS[i]; return LANGS[0]; }
function langData(){ return LANGDATA[state.lang] || {}; }
function catList(){ return CATS; }
function itemKey(cat, idx){ return state.lang + ":" + cat + ":" + idx; }
function getItem(cat, idx){ var c = (langData().cats || {})[cat] || []; return c[idx] || null; }
function allItems(){
  var out = []; var cats = langData().cats || {};
  CATS.forEach(function(c){ (cats[c.id] || []).forEach(function(it, i){ out.push({ cat: c.id, idx: i, t: it[0], e: it[1], r: it[2] || "" }); }); });
  return out;
}
function rollDay(){
  var t = todayStr();
  if(state.todayDate !== t){
    if(state.lastDay){
      var y = new Date(); y.setDate(y.getDate() - 1);
      var ys = y.getFullYear() + "-" + ("0" + (y.getMonth() + 1)).slice(-2) + "-" + ("0" + y.getDate()).slice(-2);
      if(state.lastDay !== ys && state.lastDay !== t) state.streak = 0;
    }
    state.todayDate = t; state.todayXp = 0;
  }
}
function addXp(n){
  rollDay();
  state.xp += n; state.todayXp += n;
  var t = todayStr();
  if(state.lastDay !== t){
    var y = new Date(); y.setDate(y.getDate() - 1);
    var ys = y.getFullYear() + "-" + ("0" + (y.getMonth() + 1)).slice(-2) + "-" + ("0" + y.getDate()).slice(-2);
    state.streak = (state.lastDay === ys) ? state.streak + 1 : 1;
    state.lastDay = t;
  }
  checkBadges();
}
function level(){ return Math.floor(state.xp / 100) + 1; }
var BADGES = [
  { id: "first", name: "First Steps", test: function(){ return Object.keys(state.lessonsDone).length >= 1; } },
  { id: "xp100", name: "100 XP Club", test: function(){ return state.xp >= 100; } },
  { id: "xp500", name: "500 XP Club", test: function(){ return state.xp >= 500; } },
  { id: "streak3", name: "3 Day Streak", test: function(){ return state.streak >= 3; } },
  { id: "streak7", name: "7 Day Streak", test: function(){ return state.streak >= 7; } },
  { id: "poly", name: "Explorer", test: function(){ var s = {}; Object.keys(state.lessonsDone).forEach(function(k){ s[k.split(":")[0]] = 1; }); return Object.keys(s).length >= 2; } },
  { id: "words50", name: "50 Words Reviewed", test: function(){ return Object.keys(state.srs).length >= 50; } }
];
function checkBadges(){
  BADGES.forEach(function(b){ if(state.badges.indexOf(b.id) < 0 && b.test()){ state.badges.push(b.id); say("Badge earned: " + b.name); } });
}
function wordOfDay(){
  var t = todayStr();
  if(state.wotd.date === t && state.wotd.key) return state.wotd;
  var items = allItems(); if(!items.length) return null;
  var seed = 0; for(var i = 0; i < t.length; i++) seed += t.charCodeAt(i) * (i + 3);
  var it = items[seed % items.length];
  state.wotd = { date: t, key: it.cat + ":" + it.idx, t: it.t, e: it.e, r: it.r };
  saveState();
  return state.wotd;
}
</script>
<script>
"use strict";
/* ---------------- Navigation ---------------- */
var VIEWS = ["learn","vocab","practice","progress","lesson","account","settings"];
function show(view){
  VIEWS.forEach(function(v){ var el = $("view-" + v); if(el) el.classList.toggle("active", v === view); });
  ["learn","vocab","practice","progress"].forEach(function(t){ var b = $("tab-" + t); if(b) b.classList.toggle("active", t === view); });
  if(view === "learn") renderLearn();
  if(view === "vocab") renderVocab();
  if(view === "practice") renderPractice();
  if(view === "progress") renderProgress();
  if(view === "account") renderAccount();
  if(view === "settings") renderSettings();
  try { window.scrollTo(0, 0); } catch(e){}
}
$("tab-learn").addEventListener("click", function(){ show("learn"); say("Learn tab. " + curLang().name + "."); });
$("tab-vocab").addEventListener("click", function(){ show("vocab"); say("Vocabulary tab."); });
$("tab-practice").addEventListener("click", function(){ show("practice"); say("Practice tab."); });
$("tab-progress").addEventListener("click", function(){ show("progress"); say("Progress tab."); });
$("accountBtn").addEventListener("click", function(){ show("account"); });
$("settingsBtn").addEventListener("click", function(){ show("settings"); });
$("langPickBtn").addEventListener("click", openLangPicker);

function openLangPicker(){
  var html = "<button class='btn secondary' id='lpBack'>Back</button><div class='card'><h2>Choose a language</h2><p class='dim'>You can learn more than one and switch any time. Your progress in each language is saved separately.</p>";
  LANGS.forEach(function(l){ html += "<button class='lessonbtn' data-lang='" + l.code + "'><span>" + esc(l.name) + "</span><span class='st'>" + esc(l.native) + (state.lang === l.code ? " &bull; current" : "") + "</span></button>"; });
  html += "</div>";
  var v = $("view-learn"); v.innerHTML = html;
  VIEWS.forEach(function(x){ var el = $("view-" + x); if(el) el.classList.toggle("active", x === "learn"); });
  $("lpBack").addEventListener("click", function(){ show("learn"); });
  Array.prototype.forEach.call(v.querySelectorAll("[data-lang]"), function(b){
    b.addEventListener("click", function(){
      state.lang = b.getAttribute("data-lang"); saveState();
      $("langPickBtn").textContent = curLang().name;
      say("Language set to " + curLang().name + ".");
      show("learn");
    });
  });
  say("Choose a language. " + LANGS.length + " languages available.");
}

/* ---------------- Learn (path) ---------------- */
function lessonId(cat, part){ return state.lang + ":" + cat + ":" + part; }
function isUnlocked(catIdx, part){
  if(catIdx === 0 && part === 0) return true;
  var prev = lessonList();
  for(var i = 0; i < prev.length; i++){
    if(prev[i].catIdx === catIdx && prev[i].part === part){
      if(i === 0) return true;
      return !!state.lessonsDone[prev[i - 1].id];
    }
  }
  return false;
}
function lessonList(){
  var out = [];
  CATS.forEach(function(c, ci){
    var items = (langData().cats || {})[c.id] || [];
    if(!items.length) return;
    var half = Math.ceil(items.length / 2);
    out.push({ id: lessonId(c.id, 0), cat: c.id, catIdx: ci, part: 0, title: c.title + " 1", from: 0, to: half });
    if(items.length > half) out.push({ id: lessonId(c.id, 1), cat: c.id, catIdx: ci, part: 1, title: c.title + " 2", from: half, to: items.length });
    out.push({ id: lessonId(c.id, 2), cat: c.id, catIdx: ci, part: 2, title: c.title + " Review", from: 0, to: items.length });
  });
  return out;
}
function renderLearn(){
  rollDay();
  var w = wordOfDay();
  var lessons = lessonList();
  var doneCount = lessons.filter(function(l){ return state.lessonsDone[l.id]; }).length;
  var html = "";
  html += "<div class='strip'><span class='chip'>Streak <b>" + state.streak + "</b></span><span class='chip'>XP <b>" + state.xp + "</b></span><span class='chip'>Level <b>" + level() + "</b></span><span class='chip'>Today <b>" + state.todayXp + " XP</b></span></div>";
  if(w) html += "<div class='card'><h2>Word of the day</h2><p class='big'>" + esc(w.t) + (w.r ? " <span class='dim'>(" + esc(w.r) + ")</span>" : "") + "</p><p class='dim'>" + esc(w.e) + "</p><button class='btn secondary' id='wotdBtn'>Hear it</button></div>";
  html += "<div class='card'><h2>" + esc(curLang().name) + " path</h2><p class='dim'>" + doneCount + " of " + lessons.length + " lessons done. Lessons unlock in order, like Duolingo — but nothing ever locks you out for mistakes.</p>";
  if(!state.placement[state.lang]) html += "<button class='btn secondary' id='placeBtn'>Take the placement test</button>";
  html += "</div>";
  var curCat = -1;
  lessons.forEach(function(l){
    if(l.catIdx !== curCat){ curCat = l.catIdx; var c = CATS[curCat]; html += "<div class='unithead'><h3>Unit: " + esc(c.title) + "</h3><p>" + esc(c.blurb) + "</p></div>"; }
    var done = !!state.lessonsDone[l.id];
    var unlocked = isUnlocked(l.catIdx, l.part);
    var stars = state.stars[l.id] || 0;
    html += "<button class='lessonbtn" + (done ? "" : (unlocked ? " current" : " locked")) + "' data-lesson='" + l.id + "'" + (unlocked ? "" : " disabled") + "><span>" + (done ? "Done: " : "") + esc(l.title) + "</span><span class='st'>" + (done ? stars + " stars" : (unlocked ? "Start" : "Locked")) + "</span></button>";
  });
  $("view-learn").innerHTML = html;
  if(w) $("wotdBtn").addEventListener("click", function(){ speakLang(w.t, curLang().tts, 0.85); setTimeout(function(){ say(w.e); }, 1600); });
  var pb = $("placeBtn"); if(pb) pb.addEventListener("click", startPlacement);
  Array.prototype.forEach.call($("view-learn").querySelectorAll("[data-lesson]"), function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-lesson");
      var l = lessonList().filter(function(x){ return x.id === id; })[0];
      if(l) startLesson(l);
    });
  });
}

/* ---------------- Lesson engine ---------------- */
var LSN = null;
function buildQuestions(lesson){
  var items = [];
  var catItems = (langData().cats || {})[lesson.cat] || [];
  for(var i = lesson.from; i < lesson.to; i++) items.push({ cat: lesson.cat, idx: i, t: catItems[i][0], e: catItems[i][1], r: catItems[i][2] || "" });
  var qs = [];
  items.forEach(function(it, n){
    var pool = catItems.map(function(x, xi){ return { t: x[0], e: x[1], r: x[2] || "", idx: xi }; }).filter(function(x){ return x.idx !== it.idx; });
    var typeCycle = ["listen", "chooseTarget", "chooseEnglish", "repeat", "build"];
    var type = (lesson.cat === "phrases") ? typeCycle[n % typeCycle.length] : ["listen", "chooseTarget", "chooseEnglish", "repeat"][n % 4];
    if(type === "build" && it.t.split(/\s+/).length < 2) type = "chooseTarget";
    qs.push({ type: type, item: it, distract: shuffle(pool).slice(0, 3) });
  });
  return shuffle(qs);
}
function startLesson(lesson){
  LSN = { lesson: lesson, qs: buildQuestions(lesson), i: 0, correct: 0, mode: "lesson", answered: false };
  show("lesson");
  say(lesson.title + ". " + LSN.qs.length + " questions.");
  renderQuestion();
}
function startPlacement(){
  var sampleCats = ["greet", "phrases", "food", "travel"];
  var qs = [];
  sampleCats.forEach(function(cat){
    var items = (langData().cats || {})[cat] || [];
    items.slice(0, 3).forEach(function(x, xi){ qs.push({ type: "chooseEnglish", item: { cat: cat, idx: xi, t: x[0], e: x[1], r: x[2] || "" }, distract: shuffle(items.map(function(y, yi){ return { t: y[0], e: y[1], r: y[2] || "", idx: yi }; }).filter(function(y){ return y.idx !== xi; })).slice(0, 3) }); });
  });
  LSN = { lesson: { id: "placement", title: "Placement test", cat: "greet" }, qs: shuffle(qs).slice(0, 10), i: 0, correct: 0, mode: "placement", answered: false };
  show("lesson");
  say("Placement test. Ten questions. This just tells the app where to start you.");
  renderQuestion();
}
function startMistakes(){
  if(!state.mistakes.length){ say("No mistakes saved yet. Nice work."); return; }
  var qs = state.mistakes.slice(0, 12).map(function(k){
    var parts = k.split(":"); var it = getItem(parts[1], parseInt(parts[2], 10));
    if(!it) return null;
    var catItems = (langData().cats || {})[parts[1]] || [];
    return { type: "chooseEnglish", item: { cat: parts[1], idx: parseInt(parts[2], 10), t: it[0], e: it[1], r: it[2] || "" }, distract: shuffle(catItems.map(function(y, yi){ return { t: y[0], e: y[1], r: y[2] || "", idx: yi }; }).filter(function(y){ return yi !== parseInt(parts[2], 10); })).slice(0, 3) };
  }).filter(Boolean);
  if(!qs.length){ say("No mistakes to review right now."); return; }
  LSN = { lesson: { id: "mistakes", title: "Mistakes review", cat: "greet" }, qs: qs, i: 0, correct: 0, mode: "mistakes", answered: false };
  show("lesson");
  say("Mistakes review. " + qs.length + " questions from words you missed before.");
  renderQuestion();
}
function qHeader(){
  var pct = Math.round((LSN.i / LSN.qs.length) * 100);
  return "<button class='btn secondary' id='qQuit'>Quit</button>" +
    "<div class='progresswrap' role='progressbar' aria-valuenow='" + pct + "'><div class='progressbar' style='width:" + pct + "%'></div></div>" +
    "<p class='dim center'>Question " + (LSN.i + 1) + " of " + LSN.qs.length + " &bull; " + esc(LSN.lesson.title) + "</p>";
}
function renderQuestion(){
  LSN.answered = false;
  var q = LSN.qs[LSN.i];
  var v = $("view-lesson");
  var html = qHeader();
  var choices;
  if(q.type === "listen"){
    html += "<p class='qprompt'>Listen, then pick the English meaning.</p><button class='btn' id='qPlay'>Play the word</button>";
    choices = shuffle([q.item].concat(q.distract));
    html += choices.map(function(c, ci){ return "<button class='btn secondary qchoice' data-ci='" + ci + "' data-ok='" + (c.e === q.item.e ? "1" : "0") + "'>" + esc(c.e) + "</button>"; }).join("");
  } else if(q.type === "chooseTarget"){
    html += "<p class='qprompt'>How do you say this?</p><p class='qword'>" + esc(q.item.e) + "</p>";
    choices = shuffle([q.item].concat(q.distract));
    html += choices.map(function(c, ci){ return "<button class='btn secondary qchoice' data-ci='" + ci + "' data-ok='" + (c.t === q.item.t ? "1" : "0") + "'>" + esc(c.t) + (c.r ? " (" + esc(c.r) + ")" : "") + "</button>"; }).join("");
  } else if(q.type === "chooseEnglish"){
    html += "<p class='qword'>" + esc(q.item.t) + "</p>" + (q.item.r ? "<p class='qrom'>" + esc(q.item.r) + "</p>" : "") +
      "<button class='btn secondary' id='qPlay'>Hear it</button><p class='qprompt'>What does it mean?</p>";
    choices = shuffle([q.item].concat(q.distract));
    html += choices.map(function(c, ci){ return "<button class='btn secondary qchoice' data-ci='" + ci + "' data-ok='" + (c.e === q.item.e ? "1" : "0") + "'>" + esc(c.e) + "</button>"; }).join("");
  } else if(q.type === "repeat"){
    html += "<p class='qprompt'>Listen and repeat it out loud.</p><p class='qword'>" + esc(q.item.t) + "</p>" + (q.item.r ? "<p class='qrom'>" + esc(q.item.r) + "</p>" : "") +
      "<p class='dim center'>" + esc(q.item.e) + "</p>" +
      "<button class='btn' id='qPlay'>Play it</button>" +
      "<button class='btn secondary' id='qSlow'>Play it slowly</button>" +
      "<button class='btn secondary' id='qMic'>Say it (microphone)</button>" +
      "<button class='btn secondary' id='qSaid'>I said it</button>" +
      "<p class='dim center' id='qHeard'></p>";
  } else if(q.type === "build"){
    var words = shuffle(q.item.t.replace(/[?.!,¿¡]/g, "").split(/\s+/).filter(Boolean));
    html += "<p class='qprompt'>Build this sentence. Tap the words in order.</p><p class='qword'>" + esc(q.item.e) + "</p>" +
      "<p class='qrom' id='qBuilt'>&nbsp;</p><div class='chips' id='qChips'>" +
      words.map(function(w, wi){ return "<button class='catchip' data-w='" + esc(w) + "' data-wi='" + wi + "'>" + esc(w) + "</button>"; }).join("") + "</div>" +
      "<button class='btn secondary' id='qUndo'>Undo last word</button>" +
      "<button class='btn' id='qCheck'>Check</button>";
    LSN.built = [];
  }
  html += "<div class='feedback' id='qFb' role='alert'></div><button class='btn' id='qNext' style='display:none'>Continue</button>";
  v.innerHTML = html;
  $("qQuit").addEventListener("click", function(){ LSN = null; show("learn"); say("Lesson stopped."); });
  var play = $("qPlay"); if(play) play.addEventListener("click", function(){ speakLang(q.item.t, curLang().tts, 1); });
  var slow = $("qSlow"); if(slow) slow.addEventListener("click", function(){ speakLang(q.item.t, curLang().tts, 0.55); });
  if(q.type === "listen") setTimeout(function(){ speakLang(q.item.t, curLang().tts, 1); }, 350);
  Array.prototype.forEach.call(v.querySelectorAll(".qchoice"), function(b){
    b.addEventListener("click", function(){
      if(LSN.answered) return;
      var ok = b.getAttribute("data-ok") === "1";
      gradeAnswer(ok, q, b.textContent);
    });
  });
  var said = $("qSaid"); if(said) said.addEventListener("click", function(){ if(!LSN.answered) gradeAnswer(true, q, ""); });
  var mic = $("qMic"); if(mic) mic.addEventListener("click", function(){
    say("Listening. Say it now.");
    listenLang(curLang().tts, function(text, ok){
      var heard = $("qHeard");
      if(!ok || !text){ if(heard) heard.textContent = "I couldn't hear that. Tap 'I said it' if you said it, or try the microphone again."; say("I couldn't hear that clearly."); return; }
      if(heard) heard.textContent = "You said: " + text;
      var norm = function(s){ return s.toLowerCase().replace(/[?.!,¿¡…]/g, "").replace(/\s+/g, " ").trim(); };
      var good = norm(text).indexOf(norm(q.item.t)) >= 0 || norm(q.item.t).indexOf(norm(text)) >= 0;
      gradeAnswer(good, q, text);
    });
  });
  if(q.type === "build"){
    Array.prototype.forEach.call(v.querySelectorAll("#qChips .catchip"), function(ch){
      ch.addEventListener("click", function(){
        if(LSN.answered || ch.disabled) return;
        LSN.built.push(ch.getAttribute("data-w")); ch.disabled = true; ch.style.opacity = ".35";
        $("qBuilt").textContent = LSN.built.join(" ");
      });
    });
    $("qUndo").addEventListener("click", function(){
      if(LSN.answered || !LSN.built.length) return;
      var w = LSN.built.pop();
      $("qBuilt").textContent = LSN.built.join(" ");
      Array.prototype.forEach.call(v.querySelectorAll("#qChips .catchip"), function(ch){ if(ch.disabled && ch.getAttribute("data-w") === w){ ch.disabled = false; ch.style.opacity = "1"; } });
    });
    $("qCheck").addEventListener("click", function(){
      if(LSN.answered) return;
      var norm = function(s){ return s.toLowerCase().replace(/[?.!,¿¡…]/g, "").replace(/\s+/g, " ").trim(); };
      gradeAnswer(norm(LSN.built.join(" ")) === norm(q.item.t), q, LSN.built.join(" "));
    });
  }
  $("qNext").addEventListener("click", nextQuestion);
}
function gradeAnswer(ok, q, given){
  LSN.answered = true;
  var fb = $("qFb");
  var key = itemKey(q.item.cat, q.item.idx);
  bumpSrs(key, ok);
  if(ok){
    LSN.correct++;
    var mi = state.mistakes.indexOf(key); if(mi >= 0) state.mistakes.splice(mi, 1);
    fb.className = "feedback good";
    fb.innerHTML = "Correct. <b>" + esc(q.item.t) + "</b> means <b>" + esc(q.item.e) + "</b>.";
    say("Correct.");
    speakLang(q.item.t, curLang().tts, 0.9);
  } else {
    if(state.mistakes.indexOf(key) < 0) state.mistakes.push(key);
    fb.className = "feedback bad";
    fb.innerHTML = "Not quite. <b>" + esc(q.item.t) + "</b> means <b>" + esc(q.item.e) + "</b>. It is saved in your Mistakes review.";
    say("Not quite. " + q.item.t + " means " + q.item.e + ".");
  }
  saveState();
  var nx = $("qNext"); if(nx){ nx.style.display = "block"; nx.focus(); }
}
function bumpSrs(key, ok){
  var b = state.srs[key] || 0;
  state.srs[key] = ok ? Math.min(5, b + 1) : 0;
}
function nextQuestion(){
  LSN.i++;
  if(LSN.i >= LSN.qs.length){ finishSession(); return; }
  renderQuestion();
}
function finishSession(){
  var total = LSN.qs.length, correct = LSN.correct;
  var xpGain = correct * 2 + (correct === total ? 5 : 0);
  var stars = correct === total ? 3 : (correct >= total * 0.7 ? 2 : (correct >= total * 0.4 ? 1 : 0));
  var msg = "";
  if(LSN.mode === "lesson"){
    state.lessonsDone[LSN.lesson.id] = true;
    if((state.stars[LSN.lesson.id] || 0) < stars) state.stars[LSN.lesson.id] = stars;
    addXp(xpGain);
    msg = LSN.lesson.title + " complete. You got " + correct + " of " + total + " right and earned " + xpGain + " XP.";
  } else if(LSN.mode === "placement"){
    state.placement[state.lang] = correct;
    if(correct >= 7){
      var lessons = lessonList();
      lessons.slice(0, 4).forEach(function(l){ state.lessonsDone[l.id] = true; if(!state.stars[l.id]) state.stars[l.id] = 2; });
      msg = "Placement done. You scored " + correct + " of " + total + " — strong start. I marked the first few lessons done so you start further along the path.";
    } else {
      msg = "Placement done. You scored " + correct + " of " + total + ". The path starts at the beginning, which is the right place to build from.";
    }
    addXp(correct * 2);
  } else {
    addXp(correct * 2);
    msg = "Review complete. " + correct + " of " + total + " right. Anything you missed stays in the list for next time.";
  }
  saveState();
  var v = $("view-lesson");
  v.innerHTML = "<div class='card center'><h2>Session complete</h2><p class='big'>" + esc(msg) + "</p><p class='dim'>Total XP: " + state.xp + " &bull; Streak: " + state.streak + " days</p><button class='btn' id='finBtn'>Back to Learn</button></div>";
  $("finBtn").addEventListener("click", function(){ LSN = null; show("learn"); });
  say(msg);
}
</script>
<script>

  Array.prototype.forEach.call($("view-vocab").querySelectorAll("[data-say]"), function(b){ b.addEventListener("click", function(){ var it = getItem(vocabCat, parseInt(b.getAttribute("data-say"), 10)); if(it) speakLang(it[0], curLang().tts, 1); }); });
  Array.prototype.forEach.call($("view-vocab").querySelectorAll("[data-slow]"), function(b){ b.addEventListener("click", function(){ var it = getItem(vocabCat, parseInt(b.getAttribute("data-slow"), 10)); if(it) speakLang(it[0], curLang().tts, 0.5); }); });
  Array.prototype.forEach.call($("view-vocab").querySelectorAll("[data-fav]"), function(b){ b.addEventListener("click", function(){

var FC = null;
function startFlashcards(){
  var items = ((langData().cats || {})[vocabCat] || []).map(function(it, i){ return { idx: i, t: it[0], e: it[1], r: it[2] || "" }; });
  if(!items.length) return;
  FC = { items: shuffle(items), i: 0, flipped: false };

}
function renderFlash(){
  var it = FC.items[FC.i];
  var v = $("view-lesson");
  v.innerHTML = "<button class='btn secondary' id='fcQuit'>Back to Vocabulary</button>" +
    "<div class='card center'><p class='dim'>Flashcard " + (FC.i + 1) + " of " + FC.items.length + "</p>" +
    (FC.flipped ? "<p class='qword'>" + esc(it.e) + "</p>" : "<p class='qword'>" + esc(it.t) + "</p>" + (it.r ? "<p class='qrom'>" + esc(it.r) + "</p>" : "")) +
    "<button class='btn' id='fcHear'>Hear it</button>" +
    "<button class='btn secondary' id='fcFlip'>" + (FC.flipped ? "Show the word again" : "Show the meaning") + "</button>" +
    "<div style='display:flex;gap:8px'><button class='btn bad' id='fcMiss' style='flex:1'>I missed it</button><button class='btn good' id='fcKnow' style='flex:1'>I knew it</button></div></div>";
  $("fcQuit").addEventListener("click", function(){ FC = null; show("vocab"); });
  $("fcHear").addEventListener("click", function(){ speakLang(it.t, curLang().tts, 0.9); });
  $("fcFlip").addEventListener("click", function(){ FC.flipped = !FC.flipped; renderFlash(); if(FC.flipped) say(it.e); });
  var step = function(ok){
    bumpSrs(itemKey(vocabCat, it.idx), ok);
    if(!ok){ var k = itemKey(vocabCat, it.idx); if(state.mistakes.indexOf(k) < 0) state.mistakes.push(k); }
    else { var k2 = itemKey(vocabCat, it.idx); var mi = state.mistakes.indexOf(k2); if(mi >= 0) state.mistakes.splice(mi, 1); }
    saveState();
    FC.i++; FC.flipped = false;
    if(FC.i >= FC.items.length){ FC = null; say("Flashcards done."); show("vocab"); } else renderFlash();
  };
  $("fcKnow").addEventListener("click", function(){ step(true); });
  $("fcMiss").addEventListener("click", function(){ step(false); });
  speakLang(it.t, curLang().tts, 0.9);

/* ---------------- Practice hub ---------------- */

}
var _audioTimers = [];
function stopAudioLesson(){
  _audioTimers.forEach(function(t){ clearTimeout(t); }); _audioTimers = [];

  try { speechSynthesis.cancel(); } catch(e){}
}
function startAudioLesson(){
  stopAudioLesson();
  var items = shuffle(allItems()).slice(0, 10);
  if(!items.length) return;
  say("Audio lesson. Ten words and phrases. Listen, then repeat after the slow version.");
  var delay = 2500;
  items.forEach(function(it, n){
    _audioTimers.push(setTimeout(function(){ say("Number " + (n + 1) + ". In English: " + it.e); }, delay)); delay += 2600;
    _audioTimers.push(setTimeout(function(){ speakLang(it.t, curLang().tts, 0.55, true); }, delay)); delay += 3200;

  });

}
function renderPhrasebook(){
  var phrases = ((langData().cats || {}).phrases || []).map(function(it, i){ return { idx: i, t: it[0], e: it[1], r: it[2] || "" }; });

  });

  Array.prototype.forEach.call($("view-practice").querySelectorAll("[data-psay]"), function(b){ b.addEventListener("click", function(){ var it = getItem("phrases", parseInt(b.getAttribute("data-psay"), 10)); if(it) speakLang(it[0], curLang().tts, 0.9); }); });
  Array.prototype.forEach.call($("view-practice").querySelectorAll("[data-pfav]"), function(b){ b.addEventListener("click", function(){
    var key = itemKey("phrases", parseInt(b.getAttribute("data-pfav"), 10));

function renderTranslator(){
  var html = "<button class='btn secondary' id='tBack'>Back to Practice</button><div class='card'><h2>Translator</h2>" +
    "<p class='dim'>English to " + esc(curLang().name) + ". Type or dictate, then tap Translate. Needs internet.</p>" +

  });

  $("tGo").addEventListener("click", function(){

    $("tStatus").textContent = "Translating…";

/* ---------------- Account + cloud sync ---------------- */
function sbTokens(){ try { var t = localStorage.getItem("ll_sb_tokens"); return t ? JSON.parse(t) : null; } catch(e){ return null; } }
function sbSaveTokens(a, r){ try { localStorage.setItem("ll_sb_tokens", JSON.stringify({ access: a, refresh: r })); } catch(e){} }
function sbClear(){ try { localStorage.removeItem("ll_sb_tokens"); localStorage.removeItem("ll_sb_user"); } catch(e){} }
function sbUser(){ try { var u = localStorage.getItem("ll_sb_user"); return u ? JSON.parse(u) : null; } catch(e){ return null; } }
function startGoogleLogin(){
  var url = SUPABASE_URL + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(REDIRECT);
  say("Opening Google sign-in in your browser. Finish there, then come back to the app.");
  window.location.href = url;
}
window.handleAuthCallback = function(url){
  if(!url) return;
  try {
    var hash = url.split("#")[1] || "";
    var params = {};
    hash.split("&").forEach(function(p){ var kv = p.split("="); if(kv[0]) params[kv[0]] = decodeURIComponent(kv.slice(1).join("=") || ""); });
    if(params.access_token && params.refresh_token){
      sbSaveTokens(params.access_token, params.refresh_token);
      say("Signed in. Loading your account.");
      fetchUserInfo(function(){ cloudDownload(function(){ show("account"); }); });
    } else if(url.indexOf("error") >= 0){ say("Sign-in was cancelled or failed."); }
  } catch(e){}
};
function fetchUserInfo(cb){
  var t = sbTokens(); if(!t){ if(cb) cb(); return; }
  fetch(SUPABASE_URL + "/auth/v1/user", { headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + t.access } })
    .then(function(r){ return r.json(); })
    .then(function(u){ if(u && u.id){ try { localStorage.setItem("ll_sb_user", JSON.stringify(u)); } catch(e){} } else sbClear(); if(cb) cb(); })
    .catch(function(){ if(cb) cb(); });
}
function cloudUpload(quiet){
  var t = sbTokens(); var u = sbUser();
  if(!t || !u) return;
  var payload = { user_id: u.id, data: state, updated_at: new Date(state.updatedAt || Date.now()).toISOString() };
  fetch(SUPABASE_URL + "/rest/v1/lynxo_language_progress?on_conflict=user_id", {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + t.access, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
    body: JSON.stringify(payload)
  }).then(function(r){ if(!quiet) say(r.ok ? "Progress saved to your account." : "Cloud save failed — your progress is still saved on this device."); })
    .catch(function(){ if(!quiet) say("Cloud save failed — your progress is still saved on this device."); });
}
function cloudDownload(cb){
  var t = sbTokens(); var u = sbUser();
  if(!t || !u){ if(cb) cb(false); return; }
  fetch(SUPABASE_URL + "/rest/v1/lynxo_language_progress?user_id=eq." + u.id + "&select=data,updated_at", {
    headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + t.access }
  }).then(function(r){ return r.json(); }).then(function(rows){
    if(rows && rows.length && rows[0].data){
      var cloud = rows[0].data;
      if((cloud.updatedAt || 0) > (state.updatedAt || 0) && (cloud.xp || 0) > 0){
        var keepSettings = state.settings; state = cloud; if(!state.settings) state.settings = keepSettings;
        try { localStorage.setItem("ll_state_v1", JSON.stringify(state)); } catch(e){}
        $("langPickBtn").textContent = curLang().name;
        if(cb) cb(true); return;
      }
    }
    if(cb) cb(false);
  }).catch(function(){ if(cb) cb(false); });
}
function renderAccount(){
  var u = sbUser(); var t = sbTokens();
  var html = "<button class='btn secondary' id='accBack'>Back</button><div class='card center'>";

}

  var el = $("updStatus"); if(el) el.textContent = "Update: " + s;

  else if(s.indexOf("downloading:") === 0) { /* progress ticks: keep quiet */ }
  else if(s === "installing" || s === "launched") say("Opening the installer. Tap Install when it appears.");
  else if(s === "need_permission") say("The app needs permission to install updates. Allow it on the screen that opened, then check for updates again.");
  else if(s.indexOf("error") === 0) say("Update failed. Check your connection and try again.");

function checkForUpdates(){
  var el = $("updStatus"); if(el) el.textContent = "Checking…";
  say("Checking for updates.");
  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", { headers: { "Accept": "application/vnd.github+json" } })
    .then(function(r){ return r.json(); })
    .then(function(rel){
      var tag = rel && rel.tag_name ? rel.tag_name : "";
      var m = tag.match(/\+(\d+)$/);
      var code = m ? parseInt(m[1], 10) : 0;
      if(code > APP_VERSION_CODE){
        var asset = (rel.assets || []).filter(function(a){ return /\.apk$/i.test(a.name); })[0];
        if(!asset){ if(el) el.textContent = "A new version exists but has no install file yet."; return; }
        if(el) el.textContent = "Update available: " + tag + ". Downloading…";
        say("Update available. Downloading it now.");
        try { LynxosUpdater.downloadAndInstall(asset.browser_download_url); }
        catch(e){ if(el) el.textContent = "Updater not available in this build."; }
      } else {
        if(el) el.textContent = "You are on the latest version (" + APP_VERSION_NAME + ").";
        say("You are on the latest version.");
      }
    })
    .catch(function(){ if(el) el.textContent = "Could not check. Check your connection."; say("Could not check for updates."); });
}
